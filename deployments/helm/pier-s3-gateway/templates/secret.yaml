{{- if and (not .Values.externalSecret.enabled) .Values.secret.create (not .Values.secret.existingSecret) }}
{{- if not .Values.secret.data }}
{{- fail "secret.data is empty: with externalSecret.enabled=false you must provide secret.data, set secret.existingSecret, or re-enable externalSecret - refusing to render an empty Secret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pier-s3-gateway.secretName" . }}
  labels:
    {{- include "pier-s3-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
