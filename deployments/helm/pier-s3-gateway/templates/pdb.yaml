{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pier-s3-gateway.fullname" . }}
  labels:
    {{- include "pier-s3-gateway.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "pier-s3-gateway.selectorLabels" . | nindent 6 }}
{{- end }}
