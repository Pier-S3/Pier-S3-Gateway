apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pier-s3-gateway.fullname" . }}
  labels:
    {{- include "pier-s3-gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pier-s3-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pier-s3-gateway.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "pier-s3-gateway.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: s3
              containerPort: {{ .Values.service.s3Port }}
              protocol: TCP
            - name: ui
              containerPort: {{ .Values.service.uiPort }}
              protocol: TCP
            # Probe-only listener: NOT exposed by the Service/Ingress, so
            # /_health and /_ready are unreachable from outside the cluster.
            - name: health
              containerPort: {{ .Values.healthPort }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "pier-s3-gateway.secretName" . }}
          env:
            - name: LISTEN_S3_ADDR
              value: ":{{ .Values.service.s3Port }}"
            - name: LISTEN_UI_ADDR
              value: ":{{ .Values.service.uiPort }}"
            - name: LISTEN_HEALTH_ADDR
              value: ":{{ .Values.healthPort }}"
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /_ready
              port: health
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /_health
              port: health
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
