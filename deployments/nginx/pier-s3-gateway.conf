# =============================================================================
# Pier S3 Gateway - hardened NGINX reverse proxy
# =============================================================================
#
# Two server blocks front the gateway's two upstreams:
#   - s3.example.com     -> S3 proxy API   (gateway :8080)  large, streamed bodies
#   - s3-ui.example.com  -> Web UI + REST   (gateway :8081)  browser sessions
#
# Design rules encoded here:
#   1. The client NEVER controls trust-bearing headers. We strip every inbound
#      X-Forwarded-*/Forwarded and re-set them ourselves, so the gateway's
#      rate-limiter (which keys on the RIGHT-MOST X-Forwarded-For hop) and any
#      audit logging see only values this proxy vouches for.
#   2. The end-user Authorization: Bearer <jwt> IS forwarded to the gateway
#      (the gateway verifies it and then re-signs to the S3 backend with its own
#      service credentials). NGINX must not strip it.
#   3. Hop-by-hop and smuggling vectors are closed at the edge.
#   4. Security response headers are added; the UI's app CSP is set by the app
#      itself (it needs the Keycloak origin) - do not override it here.
#
# Replace example.com hosts and the cert paths. Tested with nginx >= 1.25.
# See docs/nginx-hardening.md for the rationale behind each directive.

# --- Shared TLS + proxy policy ------------------------------------------------

# Modern TLS only (drop TLS < 1.2). Generate the dhparam once:
#   openssl dhparam -out /etc/nginx/dhparam.pem 2048
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_timeout       1d;
ssl_session_cache         shared:PierTLS:10m;
ssl_session_tickets       off;
ssl_stapling              on;
ssl_stapling_verify       on;

# Do not advertise the nginx version in errors / Server header.
server_tokens off;

# Per-IP rate limit zones (defence-in-depth; the gateway also rate-limits auth).
# The UI auth endpoints are the brute-force surface; the S3 data plane is wider.
limit_req_zone  $binary_remote_addr zone=pier_ui_auth:10m rate=20r/m;
limit_req_zone  $binary_remote_addr zone=pier_s3_api:10m  rate=50r/s;
limit_conn_zone $binary_remote_addr zone=pier_conn:10m;

# Map to drop ALL inbound hop-by-hop / proxy-control headers regardless of case.
# (Connection-listed headers are handled by nginx; these close the common
# smuggling/duplication vectors explicitly.)
map $http_transfer_encoding $pier_blocked_te { default ""; }

# --- HTTP -> HTTPS redirect (both hosts) -------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name s3.example.com s3-ui.example.com;

    # ACME challenge can be served here if you terminate certs with certbot.
    location /.well-known/acme-challenge/ { root /var/www/acme; }

    location / { return 308 https://$host$request_uri; }
}

# =============================================================================
# 1) S3 proxy API  ->  gateway :8080
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name s3.example.com;

    ssl_certificate     /etc/nginx/tls/s3.example.com.crt;
    ssl_certificate_key /etc/nginx/tls/s3.example.com.key;

    # S3 objects can be large. Set to your max object size (0 = unlimited, but
    # prefer an explicit cap to bound memory/disk abuse).
    client_max_body_size      5g;
    client_body_buffer_size   128k;
    client_body_timeout       60s;
    client_header_timeout     10s;
    send_timeout              60s;
    large_client_header_buffers 4 16k;

    # HSTS (only once you are fully on HTTPS across all subdomains).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    limit_req  zone=pier_s3_api burst=100 nodelay;
    limit_conn pier_conn 64;

    location / {
        # ---- Inbound header hygiene: neutralise client-spoofable trust headers.
        # The client must not be able to forge its apparent source IP or scheme.
        proxy_set_header X-Forwarded-For   $remote_addr;       # single trusted hop
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Forwarded         "";                 # drop RFC 7239 form
        proxy_set_header X-Forwarded-Port  $server_port;

        # ---- Forward the end-user credential. The gateway verifies this JWT and
        # re-signs to S3 with its own service account, so it MUST reach upstream.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host          $host;

        # ---- Close hop-by-hop / smuggling vectors.
        proxy_http_version 1.1;
        proxy_set_header   Connection "";        # enable keepalive, drop client's
        proxy_set_header   Proxy "";             # strip legacy "Proxy:" header
        proxy_pass_request_headers on;

        # ---- Streaming: do not buffer multi-GB object bodies through nginx.
        proxy_request_buffering  off;
        proxy_buffering          off;
        proxy_read_timeout       600s;
        proxy_send_timeout       600s;

        proxy_pass http://pier_s3_upstream;
    }

    # Health/readiness must not be reachable from the public edge.
    location ~ ^/_(health|ready)$ { return 404; }
}

# =============================================================================
# 2) Web UI + REST API  ->  gateway :8081
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name s3-ui.example.com;

    ssl_certificate     /etc/nginx/tls/s3-ui.example.com.crt;
    ssl_certificate_key /etc/nginx/tls/s3-ui.example.com.key;

    # The UI also streams object up/downloads via /api/v1/.../objects/.
    client_max_body_size      5g;
    client_body_timeout       60s;
    client_header_timeout     10s;
    large_client_header_buffers 4 16k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # NOTE: do NOT set Content-Security-Policy here. The app emits its own CSP
    # (it must allow the Keycloak origin for the OIDC token call); a second,
    # stricter edge CSP would break silent token renewal.

    limit_conn pier_conn 64;

    # Tight per-IP limit on the unauthenticated OIDC endpoints (brute-force /
    # token-exchange abuse). Generous elsewhere.
    location ~ ^/api/v1/auth/(login|callback|logout)$ {
        limit_req zone=pier_ui_auth burst=10 nodelay;
        include   /etc/nginx/snippets/pier-proxy-headers.conf;  # see below, or inline
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Forwarded         "";
        proxy_set_header Host              $host;
        proxy_set_header Authorization     $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Proxy "";
        proxy_pass http://pier_ui_upstream;
    }

    location / {
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Forwarded         "";
        proxy_set_header Host              $host;
        proxy_set_header Authorization     $http_authorization;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Proxy "";

        proxy_request_buffering off;   # streamed uploads
        proxy_buffering         off;   # streamed downloads
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;

        proxy_pass http://pier_ui_upstream;
    }

    location ~ ^/_(health|ready)$ { return 404; }
}

# --- Upstreams with keepalive -------------------------------------------------
# Point these at the gateway Service/Pod. Use IPs or a resolver-backed name;
# a bare hostname resolved only at startup means nginx fails to (re)start if DNS
# is briefly down - see the project's nginx upstream-keepalive gotcha.
upstream pier_s3_upstream {
    server 10.0.0.10:8080;   # gateway S3 port
    keepalive 32;
}
upstream pier_ui_upstream {
    server 10.0.0.10:8081;   # gateway UI port
    keepalive 32;
}
