apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pier-s3-gateway
spec:
  podSelector:
    matchLabels:
      app: pier-s3-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow Keycloak (HTTPS)
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
          protocol: TCP
    # Allow SeaweedFS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 8333
          protocol: TCP
